{% extends 'base.html' %}
{% block title %}{{ _('Editor') }}: {{ f.name }} - {{ _('Desks') }}{% endblock %}
{% block main_class %}full{% endblock %}
{% block content %}
<div class="ed-layout">
  <div class="ed-tools" id="tools">
    <button data-tool="select" title="{{ _('Select') }} (V)" class="active">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M5 3l14 8-6 1.5L10 19z"/></svg>{{ _('Select') }}</button>
    <hr>
    <button data-tool="desk" title="{{ _('Desk (B) - click or drag') }}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="6" width="18" height="9" rx="2"/><rect x="9" y="16" width="6" height="4" rx="1"/></svg>{{ _('Desk') }}</button>
    <button data-tool="block" title="{{ _('Row / block of desks (R)') }}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="9" height="6" rx="1"/><rect x="13" y="4" width="9" height="6" rx="1"/><rect x="2" y="14" width="9" height="6" rx="1"/><rect x="13" y="14" width="9" height="6" rx="1"/></svg>{{ _('Block') }}</button>
    <button data-tool="room" title="{{ _('Room (S)') }}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M8 12h8"/></svg>{{ _('Room') }}</button>
    <button data-tool="booth" title="{{ _('Booth / small room (K)') }}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="4" width="12" height="16" rx="4"/><circle cx="12" cy="12" r="2"/></svg>{{ _('Booth') }}</button>
    <button data-tool="wall" title="{{ _('Wall (W)') }}">
      <svg viewBox="0 0 24 24" fill="currentColor"><rect x="2" y="10" width="20" height="4"/></svg>{{ _('Wall') }}</button>
    <button data-tool="zone" title="{{ _('Team zone (Z)') }}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="3 2"><rect x="3" y="3" width="18" height="18" rx="3"/></svg>{{ _('Zone') }}</button>
    <button data-tool="label" title="{{ _('Label (T)') }}">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M5 4h14v3h-2V6h-4v12h2v2H9v-2h2V6H7v1H5z"/></svg>{{ _('Label') }}</button>
    <hr>
    <button id="undo" title="{{ _('Undo') }} (Ctrl+Z)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/></svg>{{ _('Undo') }}</button>
    <button id="redo" title="{{ _('Redo') }} (Ctrl+Y)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 000 12h3"/></svg>{{ _('Redo') }}</button>
    <button id="grid-on" title="{{ _('Snap to grid') }} (G)" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 8h18M3 16h18M8 3v18M16 3v18"/></svg>{{ _('Grid') }}</button>
  </div>

  <div class="plan-main">
    <div class="plan-toolbar">
      <select id="go-to" onchange="location.href=this.value">
        {% for x in floors %}<option value="{{ url_for('admin.editor', floor_id=x.id) }}" {{ 'selected' if x.id == f.id }}>{{ x.name }}</option>{% endfor %}
      </select>
      <span class="ed-status" id="status">{{ _('Loading…') }}</span>
      <span class="spacer"></span>
      <a class="btn" href="{{ url_for('web.plan', floor=f.id) }}" target="_blank">{{ _('Booking preview') }} ↗</a>
      <button class="btn primary" id="save">{{ _('Save the plan') }} <kbd style="background:transparent;color:#fff;border-color:rgba(255,255,255,.5)">Ctrl+S</kbd></button>
    </div>
    <div class="plan-wrap">
      <svg id="plan" tabindex="0"></svg>
      <div class="zoom-ctrl">
        <button class="btn" id="zoom-in" title="{{ _('Zoom in') }}">+</button>
        <button class="btn" id="zoom-out" title="{{ _('Zoom out') }}">−</button>
        <button class="btn" id="zoom-fit" title="{{ _('Whole plan') }}">⤢</button>
      </div>
    </div>
  </div>

  <aside class="ed-props" id="props"></aside>
</div>

<template id="tpl-floor">
  <h3 style="margin-top:0">{{ _('Floor:') }} {{ f.name }}</h3>
  <form method="post" action="{{ url_for('admin.save_floor') }}" id="floor-form">
    <input type="hidden" name="csrf" value="{{ csrf_token }}">
    <input type="hidden" name="id" value="{{ f.id }}">
    <input type="hidden" name="to_editor" value="1">
    <input type="hidden" name="active" value="{{ '1' if f.active else '' }}">
    <input type="hidden" name="sort_order" value="{{ f.sort_order }}">
    <label class="f">{{ _('Name') }}<input type="text" name="name" value="{{ f.name }}"></label>
    <label class="f">{{ _('Location / building') }}<input type="text" name="location" value="{{ f.location or '' }}"></label>
    <div class="two">
      <label class="f">{{ _('Width') }}<input type="number" name="width" value="{{ f.width }}" min="400" max="6000"></label>
      <label class="f">{{ _('Height') }}<input type="number" name="height" value="{{ f.height }}" min="300" max="6000"></label>
    </div>
    <label class="f">{{ _('Grid (px)') }}<input type="number" name="grid" value="{{ f.grid }}" min="5" max="100"></label>
    <button class="btn">{{ _('Save the floor settings') }}</button>
  </form>
  <h3>{{ _('Background (floor plan image)') }}</h3>
  <p class="small muted">{{ _('Upload a scan or an export of the floor plan (PNG/JPG/SVG) and draw the desks on it.') }}</p>
  <input type="file" id="bg-file" accept=".png,.jpg,.jpeg,.svg,.webp">
  <label class="f" style="margin-top:8px">{{ _('Background visibility') }} <input type="range" id="bg-opacity" min="0" max="1" step="0.05" value="{{ f.background_opacity }}"></label>
  <button class="btn sm danger" id="bg-remove">{{ _('Remove the background') }}</button>
  <h3>{{ _('Desk colours in the editor') }}</h3>
  <div class="legend">
    <span><i style="background:#94a3b8"></i>{{ _('open to everyone') }}</span>
    <span><i style="background:#334155"></i>{{ _('permanent desk') }}</span>
    <span><i style="background:#cbd5e1"></i>{{ _('not bookable') }}</span>
    <span><i style="background:linear-gradient(90deg,#e11d48,#1d5fbf)"></i>{{ _('team colour') }}</span>
  </div>
  <p class="small muted">{{ _('Dots in the corner of a desk = further teams. A desk without its own teams inherits them from the zone it stands in.') }}</p>
  <h3>{{ _('Summary') }}</h3>
  <p class="small" id="summary"></p>
  <h3>{{ _('Shortcuts') }}</h3>
  <div class="help">
    <kbd>V</kbd> {{ _('select') }} · <kbd>B</kbd> {{ _('desk') }} · <kbd>R</kbd> {{ _('block') }} · <kbd>S</kbd> {{ _('room') }} · <kbd>K</kbd> {{ _('booth') }} · <kbd>W</kbd> {{ _('wall') }} · <kbd>Z</kbd> {{ _('zone') }} · <kbd>T</kbd> {{ _('label') }}<br>
    <kbd>Del</kbd> {{ _('delete') }} · <kbd>Ctrl+D</kbd> {{ _('duplicate') }} · <kbd>Ctrl+C</kbd>/<kbd>Ctrl+V</kbd> {{ _('copy/paste') }}<br>
    <kbd>Ctrl+A</kbd> {{ _('select all') }} · <kbd>Shift</kbd>+{{ _('click - add to the selection') }}<br>
    {{ _('Arrows - move (with Shift ×5)') }} · <kbd>Q</kbd>/<kbd>E</kbd> {{ _('rotate by 90°') }}<br>
    <kbd>Alt</kbd> {{ _('while dragging - no grid') }} · <kbd>{{ _('Space') }}</kbd>/{{ _('middle button - moving the view') }}
  </div>
</template>
{% endblock %}
{% block scripts %}
<script>
  const FLOOR_ID = {{ f.id }};
  const TEAMS = {{ teams|tojson }};
</script>
<script src="{{ url_for('static', filename='js/editor.js') }}"></script>
{% endblock %}
