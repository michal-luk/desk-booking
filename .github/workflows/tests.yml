name: tests
on: [push, pull_request]
jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        db: [sqlite, postgresql, mariadb]
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_PASSWORD: test, POSTGRES_DB: desks }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
      mariadb:
        image: mariadb:11
        env: { MARIADB_ROOT_PASSWORD: test, MARIADB_DATABASE: desks }
        ports: ["3306:3306"]
        options: --health-cmd "healthcheck.sh --connect" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: translations
        run: python tools/i18n_check.py
      - name: smoke test
        run: |
          case "${{ matrix.db }}" in
            sqlite) python tests/smoke_test.py ;;
            postgresql) python tests/smoke_test.py --db postgresql://postgres:test@127.0.0.1:5432/desks ;;
            mariadb) python tests/smoke_test.py --db mariadb://root:test@127.0.0.1:3306/desks ;;
          esac
